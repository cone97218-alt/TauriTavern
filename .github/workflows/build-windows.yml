name: Build Windows

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Package type to build"
        required: true
        default: "both (Portable + Installer)"
        type: choice
        options:
          - "both (Portable + Installer)"
          - "portable only"
          - "installer only"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend bundle
        run: pnpm run web:build

      - name: Build Windows Installer (NSIS & MSI)
        if: ${{ contains(inputs.build_type, 'Installer') || contains(inputs.build_type, 'installer') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURITAVERN_SKIP_WEB_BUILD: "1"
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          uploadWorkflowArtifacts: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Build Windows Portable (.exe)
        if: ${{ contains(inputs.build_type, 'Portable') || contains(inputs.build_type, 'portable') }}
        shell: bash
        run: |
          node scripts/build-portable.mjs --skip-web-build --output-dir portable

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-Windows-x64
          path: |
            portable/*
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
