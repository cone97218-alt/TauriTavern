name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Android target architecture (aarch64 is recommended for modern 64-bit phones)"
        required: true
        default: "aarch64"
        type: choice
        options:
          - "aarch64"
          - "armv7"
          - "aarch64 armv7"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            src-tauri/crates/tauritavern/gen/android/**/*.gradle*
            src-tauri/crates/tauritavern/gen/android/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup local Android signing keystore
        shell: bash
        run: |
          mkdir -p src-tauri/crates/tauritavern/gen/android
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.jks" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          cat <<EOF > src-tauri/crates/tauritavern/gen/android/keystore.properties
          keyAlias=androiddebugkey
          password=android
          storeFile=$RUNNER_TEMP/debug.jks
          EOF

      - name: Enable HTTP access for standard mobile bundle
        run: ./scripts/ci/configure-mobile-http.sh enable android

      - name: Build Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: android
          args: --verbose --apk --split-per-abi --target ${{ inputs.target }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-Android-APK
          path: |
            src-tauri/crates/tauritavern/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
